upstream django {
    server web:8000;  # Django web-контейнер
}

upstream executor {
    server executor:8080;  # Executor контейнер (для WebSocket)
}

server {
    listen 80;

    # Всё, что не /ws/run/, идёт на Django
    location / {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # POST /playground/run → Django
    location /playground/run {
        proxy_pass http://django;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket для исполнения кода → executor
    location /ws/run/ {
        proxy_pass http://executor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }
}