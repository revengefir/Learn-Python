{% extends "user/layout.html" %}
{% block content %}

<head>
    <meta charset="utf-8">
    <title>Learn-Python IDE</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.2/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.62.2/mode/python/python.min.js"></script>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css" />

    <style>
        body { background-color: #f0f4f7; display: flex; justify-content: center; min-height: 100vh; font-family: Arial, sans-serif; }
        .container { max-width: 900px; background: white; padding: 25px; border-radius: 10px; margin-top: 30px; }
        #console { background: black; color: #0f0; height: 300px; overflow-y: auto; padding: 10px; font-family: monospace; white-space: pre-wrap; border-radius: 5px; outline: none; }
    </style>
</head>

<div class="container">
    <h3 style="color: gray;">Learn-Python</h3>
    <label>Код</label>
    <textarea id="codearea">{{ code|default:"" }}</textarea>
    <hr>
    <label>Консоль</label>
    <div id="console" contenteditable="true"></div>
    <button id="runBtn" class="btn btn-success">Запустить</button>
</div>

<script>
const editor = CodeMirror.fromTextArea(
    document.getElementById("codearea"),
    { mode: "python", lineNumbers: true, indentUnit: 4 }
);

const consoleDiv = document.getElementById("console");
const runBtn = document.getElementById("runBtn");
let socket = null;
let inputBuffer = "";

// Вывод в консоль
function appendOutput(text) {
    consoleDiv.textContent += text;
    consoleDiv.scrollTop = consoleDiv.scrollHeight;
}

// Запуск кода
runBtn.onclick = async () => {
    consoleDiv.textContent = "";
    inputBuffer = "";

    try {
        const response = await fetch("/playground/run", {
            method: "POST",
            headers: {
                "X-CSRFToken": "{{ csrf_token }}",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ code: editor.getValue() })
        });

        const data = await response.json();
        const sessionId = data.session_id;

        socket = new WebSocket(`ws://${window.location.host}/ws/run/${sessionId}/`);

        socket.onmessage = (event) => {
            const msg = JSON.parse(event.data);

            if (msg.type === "output") appendOutput(msg.data);
            if (msg.type === "exit") appendOutput("\n[program finished]");
        };

        socket.onerror = () => appendOutput("\n[WebSocket error]");

    } catch (err) {
        appendOutput("[Fetch error] " + err);
    }
};

// Ввод пользователя для input()
consoleDiv.addEventListener("keydown", (e) => {
    if (!socket || socket.readyState !== 1) return;

    if (e.key === "Enter") {
        e.preventDefault();
        socket.send(inputBuffer); // отправляем ввод Python
        inputBuffer = "";          // очищаем буфер
        // НЕ выводим в консоль то, что вводит пользователь
    } else if (e.key === "Backspace") {
        e.preventDefault();
        inputBuffer = inputBuffer.slice(0, -1);
        // НЕ трогаем консоль
    } else if (e.key.length === 1) {
        e.preventDefault();
        inputBuffer += e.key;
        // НЕ выводим символ в консоль
    }
});
</script>



{% endblock %}
